# ─────────────────────────────────────────────────────────────────────────────
# SmartCow Tracker — Configuración Mosquitto 2
# ─────────────────────────────────────────────────────────────────────────────

# ─── Listener 1883: MQTT sin TLS (solo desarrollo local) ─────────────────────
listener 1883
allow_anonymous true

# ─── Listener 8883: MQTTS con TLS ────────────────────────────────────────────
# Genera los certificados con: ./scripts/gen-certs.sh
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
# No se requiere certificado de cliente por ahora.
# Cambiar a true cuando los collares tengan certificados en producción.
require_certificate false

# ─── Persistencia ─────────────────────────────────────────────────────────────
# Guarda mensajes retenidos y suscripciones QoS entre reinicios
persistence true
persistence_location /mosquitto/data/

# ─── Logging ──────────────────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_type all
