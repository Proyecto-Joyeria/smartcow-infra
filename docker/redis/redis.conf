# ─────────────────────────────────────────────────────────────────────────────
# SmartCow Tracker — Configuración Redis 7 (desarrollo)
# ─────────────────────────────────────────────────────────────────────────────

# ─── Persistencia AOF (Append-Only File) ─────────────────────────────────────
# Escribe cada comando al log para recuperación ante reinicios
appendonly yes

# fsync cada segundo: buen balance entre durabilidad y rendimiento
appendfsync everysec

# ─── Seguridad ────────────────────────────────────────────────────────────────
# Sin contraseña en desarrollo local.
# Activar en producción descomentando la siguiente línea:
# requirepass your_strong_redis_password_here

# ─── Límite de memoria ────────────────────────────────────────────────────────
# Máximo 256 MB; cuando se alcanza aplica la política de evicción
maxmemory 256mb

# Política LRU global: elimina la key menos usada recientemente (cualquier key)
maxmemory-policy allkeys-lru
